services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../backend:/app
    command: sh -c "sleep infinity"
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    command: sh -c "sleep infinity"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
